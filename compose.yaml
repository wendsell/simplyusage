services:
  simplyusage:
    image: ghcr.io/wendsell/simplyusage:1
    # To build from source instead, replace the line above with:  build: .
    container_name: simplyusage
    restart: unless-stopped
    env_file: secrets.env
    volumes:
      - ./data:/data
      # The SimplyPrint bridge's log dir (bind-mounted out of the bridge
      # container; see the setup guide). Needed for <PRINTER>_SOURCE=bridge-log.
      # Adjust the path to wherever your bridge's compose project lives.
      - ../simplyprint/logs:/bridge-logs:ro
